[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copper-trafficking-mechanism"
version = "0.4.0a1"
description = "Reproducible molecular-simulation analysis workflows for copper-trafficking systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "MDAnalysis>=2.6",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
openmm-simulation = ["openmm>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
